// Applied from an individual target project, not from the aggregate root project.
apply plugin: 'maven-publish'

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            groupId = project.group.toString()
            artifactId = base.archivesName.get()
            version = project.version.toString()

            // Loader and Minecraft dependencies are supplied by the game runtime,
            // so the published mod POM must not expose the target build classpath.
            pom.withXml {
                def dependenciesNode = asNode().getAt('dependencies')[0]
                if (dependenciesNode != null) {
                    dependenciesNode.children().toList().each { dependency ->
                        dependenciesNode.remove(dependency)
                    }
                }
            }
        }
    }

    repositories {
        def isSnapshot = project.version.toString().toLowerCase().contains('snapshot')
        def publishUrl = isSnapshot ?
                'https://maven.sighs.cc/repository/maven-snapshots/' :
                'https://maven.sighs.cc/repository/maven-releases/'

        maven {
            name = 'remoteRepo'
            url = uri(publishUrl)
            credentials {
                username = System.getenv('SIGHS_PUBLISH_USER')
                password = System.getenv('SIGHS_PUBLISH_PASSWORD')
            }
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}
